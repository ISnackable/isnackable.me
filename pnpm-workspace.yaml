packages:
  - "apps/*"
  - "packages/*"
  - "packages/cms/functions/*"
allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": false
  "@swc/core": true
  bufferutil: true
  core-js: true
  esbuild: true
  sharp: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
overrides:
  "@vercel/frameworks>js-yaml": 3.15.2
  "@vercel/frameworks>smol-toml": 1.9.1
  "@module-federation/dts-plugin>undici": 7.30.2
  "@oclif/core>minimatch": 11.0.5
# Avoid patching a missing draft during publish/edit races until Sanity fixes:
# https://github.com/sanity-io/sanity/issues/15773
patchedDependencies:
  "@sanity/mutator@6.22.0": patches/@sanity__mutator.patch
  "@sanity/mutator@6.24.0": patches/@sanity__mutator.patch
